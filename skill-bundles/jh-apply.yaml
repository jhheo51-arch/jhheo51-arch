name: jh-apply
skills:
  - humanizer
  - microsoft-office
  - pdf
description: 지원 서류 작성과 파일 검수
instruction: 채용 공고 링크와 실제 마감 시각을 확인하고 비공개 작업 기록에 남깁니다. 경력과 수치는 확정된 자료만 사용하며 마스터와
  회사별 맞춤본을 분리합니다. 회사 맞춤 디자인에는 jh-design의 절차나 design-md를 추가로 읽습니다. 문서에는 가운데 점과 
  키워드 태그, 과장된 성과를 쓰지 않습니다. 제출본을 실제로 생성하고 모든 쪽 이미지를 확인합니다. 지원서 제출과 외부 발송은 사용자가 
  합니다. 채용 자료나 개인 메모리를 공개 저장소에 새로 올리지 않습니다.
