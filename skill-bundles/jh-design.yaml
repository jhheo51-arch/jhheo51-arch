name: jh-design
skills:
  - design-md
  - claude-design
description: 디자인 기준서와 실제 시안 제작
instruction: 먼저 현재 AGENTS.md, 기존 디자인 토큰과 DESIGN.md를 읽습니다. 회사 맞춤 자료는 공식 출처를 확인해 
  brand-kit.html과 brand/DESIGN.md에 기록합니다. 스킬은 제작 절차이고 DESIGN.md는 작업별 값이므로 대체하지 
  않습니다. 기존 design.md는 내용을 보존하고 대소문자 중복 파일을 만들지 않습니다. 필요한 경우에만 도구를 설치하고, 기준서 검사와 
  실제 화면 또는 전체 쪽 이미지 검사를 분리해서 보고합니다.
