<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salesforce Lead 연결 PoC | 원본 10쪽</title>
  <link rel="stylesheet" href="assets/portfolio-typography.css">
  <style>
    :root { color-scheme: light; --accent: #245c48; --line: #d4e0d9; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; max-width: 72rem; padding: 0 .75rem .75rem; background: #f7faf7; color: #192923; font: 1rem/1.5 var(--portfolio-font); }
    nav { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0 .75rem; padding: .25rem 0; }
    a { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent); font-weight: 650; text-underline-offset: .2em; }
    a:focus-visible, button:focus-visible, .zoom-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
    .preview { display: block; width: fit-content; max-width: 100%; margin: 0 auto; text-align: center; cursor: zoom-in; }
    .preview img { display: block; width: auto; height: auto; max-width: 100%; max-height: calc(100vh - 6.25rem); max-height: calc(100svh - 6.25rem); margin: 0 auto; border: 1px solid var(--line); }
    .preview span { display: inline-block; margin-top: .35rem; font-size: .875rem; }
    dialog { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #f7faf7; color: #192923; }
    dialog[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .zoom-toolbar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .375rem .75rem; border-bottom: 1px solid var(--line); }
    .zoom-toolbar p { margin: 0; font-size: .875rem; }
    .zoom-toolbar button { min-height: 44px; padding: .25rem .75rem; border: 1px solid var(--accent); border-radius: .35rem; background: #fff; color: var(--accent); font: inherit; white-space: nowrap; cursor: pointer; }
    .zoom-scroll { overflow: auto; overscroll-behavior: contain; }
    .zoom-scroll:focus-visible { outline-offset: -2px; }
    .zoom-scroll img { display: block; width: clamp(1080px, 320vw, 1600px); height: auto; margin: 0 auto; }
  </style>
</head>
<body>
  <nav aria-label="Lead PoC 자료">
    <a href="work-map.html">작업 지도</a>
    <a href="assets/lead-poc-p10-20261123-v1.pdf">PDF 파일 열기</a>
  </nav>
  <main>
    <a class="preview" id="page-preview" href="assets/lead-poc-p10-20261123-v1.png" aria-haspopup="dialog">
      <img src="assets/lead-poc-p10-20261123-v1.png" width="1600" height="900"
        alt="원본 포트폴리오 10쪽, Salesforce Lead 연결 PoC. 랜딩페이지 입력값을 Salesforce Lead로 연결하고 테스트 입력으로 레코드 생성을 확인한 화면입니다.">
      <span>페이지 확대</span>
    </a>
  </main>
  <dialog id="page-zoom" aria-label="Lead PoC 10쪽 확대">
    <form class="zoom-toolbar" method="dialog">
      <p>밀어서 다른 부분 보기</p>
      <button autofocus>전체 보기</button>
    </form>
    <div class="zoom-scroll" tabindex="0" role="region" aria-label="확대된 페이지 이동">
      <img src="assets/lead-poc-p10-20261123-v1.png" width="1600" height="900" alt="Salesforce Lead 연결 PoC 원본 10쪽 확대">
    </div>
  </dialog>
  <script>
    const preview = document.getElementById('page-preview');
    const zoom = document.getElementById('page-zoom');
    const zoomScroll = zoom.querySelector('.zoom-scroll');
    const zoomImage = zoomScroll.querySelector('img');

    preview.addEventListener('click', (event) => {
      if (!zoom.showModal || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      const bounds = preview.querySelector('img').getBoundingClientRect();
      const tapped = event.detail && event.clientY >= bounds.top && event.clientY <= bounds.bottom;
      const x = tapped ? (event.clientX - bounds.left) / bounds.width : 0.5;
      const y = tapped ? (event.clientY - bounds.top) / bounds.height : 0.5;

      zoom.showModal();
      zoomScroll.scrollTo(
        zoomImage.clientWidth * x - zoomScroll.clientWidth / 2,
        zoomImage.clientHeight * y - zoomScroll.clientHeight / 2,
      );
    });
  </script>
</body>
</html>
